# Deploy do BACKEND no Render (Infrastructure as Code).
# O frontend NAO vive aqui — ele vai para a Vercel (pasta ./frontend).
#
# Para aplicar: Render > New > Blueprint > aponte para este repositorio.

services:
  - type: web
    name: futebol-varzea-teste     # mantem a URL atual: futebol-varzea-teste.onrender.com
    runtime: node
    plan: free
    # Medido do Brasil (RTT ICMP): Oregon 167ms, Virginia 113ms, Ohio 125ms.
    # Sao Paulo deu 224ms — a rota do provedor para dentro do Brasil e pior que
    # a dos EUA, entao vale MEDIR em vez de assumir que a regiao mais proxima
    # geograficamente ganha. Virginia corta ~54ms do RTT de cada jogador.
    region: virginia
    # SEM rootDir de proposito.
    #
    # Com `rootDir: server`, o Render nao entrega a instancia nada que esteja
    # fora dessa pasta — a documentacao e literal: "Files outside your service's
    # root directory are not available to the service at build time or at
    # runtime". E a lista da beta mora em firestore.rules, na RAIZ.
    #
    # Ou seja: em producao o server/auth.js tentava ler ../firestore.rules, o
    # arquivo nao existia, o catch devolvia lista vazia e ninguem ficava
    # sabendo. Todo e-mail acrescentado as regras era ignorado, e so
    # MP_ALLOWED_EMAILS mantinha a beta de pe.
    #
    # Sem rootDir o repositorio inteiro vai junto, e a lista volta a ser uma so.
    #
    # O build usa `cd server` e nao `npm --prefix server install`: rodando na
    # raiz, o --prefix ainda dispara o postinstall do package.json da raiz, que
    # por sua vez chama `npm --prefix server install` de novo — recursao
    # infinita, build reprovado. Entrar na pasta antes evita o assunto.
    buildCommand: cd server && npm install
    startCommand: node server/server.js
    healthCheckPath: /health
    # Sem rootDir, qualquer push dispararia deploy — inclusive mudanca so no
    # frontend, que vive na Vercel. O filtro devolve esse comportamento, e agora
    # inclui explicitamente o firestore.rules: mudar a lista da beta TEM que
    # reimplantar o backend. (Os caminhos do buildFilter sao relativos a raiz do
    # repositorio, mesmo quando ha rootDir.)
    buildFilter:
      paths:
        - server/**
        - firestore.rules
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Trave o backend nos dominios do frontend depois do primeiro deploy da
      # Vercel. Sem isso, qualquer site consegue abrir salas no seu servidor.
      - key: ALLOWED_ORIGINS
        sync: false
      # A lista da beta sai do firestore.rules (o servidor le o arquivo no
      # boot). Esta variavel e so o atalho para liberar alguem sem esperar
      # deploy: se preenchida, manda no lugar do arquivo.
      - key: MP_ALLOWED_EMAILS
        sync: false
      # Projeto do Firebase que assina os ID tokens do login Google.
      - key: FIREBASE_PROJECT_ID
        value: creative-footbal
      # VoIP (LiveKit Cloud). sync: false = o valor vive no painel do Render,
      # nunca neste arquivo — o API_SECRET nao pode ir para o repositorio.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
